name: takecare
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.4
  http: ^1.6.0
  provider: ^6.1.5+1
  firebase_core: ^4.4.0
  flutter_svg: ^2.2.3
  camera: ^0.12.0
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^12.0.1

  # ✅ Production-grade notifications
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.0
  timezone: ^0.9.4
  # ❌ ตัด flutter_timezone ออก — ใช้ hardcode Asia/Bangkok แทน (ไม่มี bug Kotlin)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Italic.ttf
          style: italic
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
